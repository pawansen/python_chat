[project]
name = "py_chat-chat"
version = "1.0.0"
description = "py_chat real-time chat backend (FastAPI + python-socketio port of py_chat-chat)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "redis>=5.0",
    "python-socketio>=5.11",
    "httpx>=0.27",
    "boto3>=1.34",
    "PyJWT>=2.8",
    "firebase-admin>=6.5",
    "hashids>=1.3",
    "python-multipart>=0.0.9",
    "twilio>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "moto[server]>=5.0",
    "fakeredis>=2.23",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a local MySQL / Redis / DynamoDB emulator (see tests/README.md)",
    "e2e: drives a running server over HTTP + Socket.IO",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/harness/.run"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP038", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Test harness / regression driver: blocking I/O against local test servers is intentional.
"tests/harness/*" = ["ASYNC210", "ASYNC240"]
"tests/e2e/*" = ["ASYNC210", "ASYNC240"]
