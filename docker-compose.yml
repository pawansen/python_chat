# Local stack. Real credentials go in .env (never committed); see .env.example.
services:
  chat:
    build: .
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports:
      - "${PORT:-7091}:7091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-py_chat}
      MYSQL_USER: ${DB_USER:-py_chat}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

volumes:
  mysql-data:
